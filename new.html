<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MM Mart</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#f5f5f5;
}

/* HEADER */

header{
    background:linear-gradient(to right,orange,gold);
    padding:20px;
    color:white;
    text-align:center;
}

header h1{
    font-size:40px;
    margin-bottom:10px;
}

header p{
    font-size:18px;
}

/* NAVBAR */

nav{
    background:#222;
    padding:15px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:20px;
    font-size:18px;
}

nav a:hover{
    color:orange;
}

/* SEARCH */

.search-box{
    text-align:center;
    margin:30px;
}

.search-box input{
    width:300px;
    padding:12px;
    border-radius:10px;
    border:1px solid gray;
}

.search-box button{
    padding:12px 20px;
    background:orange;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.search-box button:hover{
    background:black;
}

/* RESULT */

.result{
    text-align:center;
    margin:20px;
    color:green;
}

/* BANNER */

.banner{
    width:90%;
    margin:auto;
    background:#444;
    color:white;
    padding:20px;
    text-align:center;
    border-radius:30px;
    font-size:40px;
    font-style:italic;
}

/* PRODUCTS */

.products{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:30px;
    padding:40px;
}

.card{
    width:250px;
    background:white;
    border-radius:20px;
    padding:15px;
    text-align:center;
    box-shadow:0px 0px 10px gray;
    transition:0.5s;
}

.card:hover{
    transform:scale(1.05);
}

.card img{
    width:100%;
    height:180px;
    border-radius:15px;
}

.card h2{
    margin:10px;
}

.card p{
    color:green;
    font-size:20px;
}

.card button{
    margin-top:10px;
    padding:10px 20px;
    background:orange;
    color:white;
    border:none;
    border-radius:10px;
}

/* FOOTER */

footer{
    background:black;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:30px;
}

</style>
</head>

<body>

<header>
    <h1>🛒 Smart Shopping Hub</h1>
    <p>Online Grocery & Electronics Store</p>
</header>

<nav>
    <a href="">Home</a>
    <a href="">Vegetables</a>
    <a href="">Electronics</a>
    <a href="">Offers</a>
    <a href="">Contact</a>
</nav>

<div class="search-box">

<input type="text" id="searchbox"
placeholder="Search item">

<button onclick="searchItem()">
Search
</button>

</div>

<div class="result"></div>

<div class="banner">
    DISCOUNT UP TO 40%
</div>

<div class="products">

<div class="card">
<img src="https://images.unsplash.com/photo-1542838132-92c53300491e">
<h2>Fresh Vegetables</h2>
<p>₹120</p>
<button>Buy Now</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9">
<h2>Smart Phone</h2>
<p>₹15,999</p>
<button>Buy Now</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1586201375761-83865001e31c">
<h2>Rice Bag</h2>
<p>₹850</p>
<button>Buy Now</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30">
<h2>Watch</h2>
<p>₹3,500</p>
<button>Buy Now</button>
</div>

</div>

<footer>
    <h2>Prepared By Nagendra</h2>
</footer>

<script>

function searchItem(){

let item =
document.getElementById("searchbox").value.toLowerCase();

let result =
document.getElementsByClassName("result")[0];

if(item=="laptop"){

result.innerHTML =
"<h2>Laptop Available</h2>";

}

else if(item=="vegetables"){

result.innerHTML =
"<h2>Vegetables Available</h2>";

}

else if(item=="electronics"){

result.innerHTML =
"<h2>Electronics Available</h2>";

}

else{

result.innerHTML =
"<h2>Item Not Found</h2>";

}
function  button(){

    document.getElementById("demo").innerHTML="product added to cart"
}

}

</script>

</body>
</html>
