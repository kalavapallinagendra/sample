<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .nag{
            width: 10px;
            height: 15px;
            background-color: aqua;
            position: static;
            animation: start 3s infinite;
        }
        :start{
            0% {  left: 0px;} 
            50% {  left: 20px;}
            100% { left:0px;}
        }
    </style>
</head>
<body>
    <div class="nag"></div>
</body>
</html>
