<html>
    <head>
        <title>Variables in CSS</title>
        <style>

          

body {
    background-color: lightblue;
    color: black;
}

        
.box {
    background-color: white;
    padding: 20px;
    border: 2px solid black;
}

.box--dark {
    background-color: grey;
    color: white;
}
.box--pink {
    background-color: pink;
    color: blue;
}
.box__red {
    color: red;
}

       


        </style>

    </head>
    <body>
      <div class="box box--dark">
        <h2 class="box__red">Heading Tag</h2>
        <p>This is a para tag</p>
        <button>Click Me</button>
      </div>
      <div class="box">
        <h2 >Heading Tag</h2>
        <p>This is a para tag</p>
        <button>Click Me</button>
      </div>
      <div class="box box--pink">
        <h2 >Heading Tag</h2>
        <p>This is a para tag</p>
        <button>Click Me</button>
      </div>

      <h2>It will not affect the layout</h2>

    </body>
</html>
